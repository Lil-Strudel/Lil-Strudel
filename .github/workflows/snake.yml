name: Generate snake animation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#c4b28a&color_dots=#282727,#3b4a52,#5a7380,#8ba4b0,#c5d7de
            dist/snake-light.svg?color_snake=#c4746e&color_dots=#ebe7dd,#c7d7de,#8ba4b0,#5d7a88,#2d4f67

      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
