<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="MonoLisa, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" role="img" aria-label="Strudel Homelab: six Dell OptiPlex nodes running Talos Linux, Cilium, kube-vip, Rook-Ceph and Flux, with the MikroTik network managed by Terraform">
<style>
.up{animation:up .4s ease-out both}
@keyframes up{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="1200" height="440" rx="16"/></clipPath>
<radialGradient id="wall" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#2a2421"/><stop offset=".55" stop-color="#1d1c19"/><stop offset="1" stop-color="#0d0c0c"/></radialGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="440" fill="url(#wall)"/>
<circle cx="32" cy="30" r="6" fill="#c4746e"/>
<circle cx="52" cy="30" r="6" fill="#c4b28a"/>
<circle cx="72" cy="30" r="6" fill="#87a987"/>
<text x="600" y="35" font-size="13" text-anchor="middle" fill="#7a8382">strudel@utah: ~/homelab</text>

<g font-size="18">
<text x="48" y="92" xml:space="preserve"><tspan fill="#8ea4a2" font-weight="bold">~/homelab</tspan><tspan fill="#87a987"> ❯ </tspan><tspan fill="#c5c9c5">kubectl get nodes</tspan></text>
<text x="48" y="130" fill="#7a8382">NAME</text><text x="216" y="130" fill="#7a8382">STATUS</text><text x="336" y="130" fill="#7a8382">ROLES</text>
<text x="48" y="158" fill="#c5c9c5">makima-1</text><text class="up" style="animation-delay:.3s" x="216" y="158" fill="#87a987">Ready</text><text x="336" y="158" fill="#a292a3">control-plane</text>
<text x="48" y="184" fill="#c5c9c5">makima-2</text><text class="up" style="animation-delay:.45s" x="216" y="184" fill="#87a987">Ready</text><text x="336" y="184" fill="#a292a3">control-plane</text>
<text x="48" y="210" fill="#c5c9c5">makima-3</text><text class="up" style="animation-delay:.6s" x="216" y="210" fill="#87a987">Ready</text><text x="336" y="210" fill="#a292a3">control-plane</text>
<text x="48" y="236" fill="#c5c9c5">rem-1</text><text class="up" style="animation-delay:.75s" x="216" y="236" fill="#87a987">Ready</text><text x="336" y="236" fill="#625e5a">&lt;none&gt;</text>
<text x="48" y="262" fill="#c5c9c5">rem-2</text><text class="up" style="animation-delay:.9s" x="216" y="262" fill="#87a987">Ready</text><text x="336" y="262" fill="#625e5a">&lt;none&gt;</text>
<text x="48" y="288" fill="#c5c9c5">rem-3</text><text class="up" style="animation-delay:1.05s" x="216" y="288" fill="#87a987">Ready</text><text x="336" y="288" fill="#625e5a">&lt;none&gt;</text>

<text x="48" y="384" xml:space="preserve"><tspan fill="#8ea4a2" font-weight="bold">~/homelab</tspan><tspan fill="#87a987"> ❯ </tspan><tspan fill="#c5c9c5">ls kubernetes/apps/main</tspan></text>
<text x="48" y="414"><tspan x="48" fill="#8ba4b0" font-weight="bold">dashy</tspan><tspan x="123.6" fill="#8ba4b0" font-weight="bold">factorio</tspan><tspan x="231.6" fill="#8ba4b0" font-weight="bold">immich</tspan><tspan x="318.0" fill="#c5c9c5">kustomization.yaml</tspan><tspan x="534.0" fill="#8ba4b0" font-weight="bold">rustdesk</tspan><tspan x="642.0" fill="#8ba4b0" font-weight="bold">shlink</tspan><tspan x="728.4" fill="#8ba4b0" font-weight="bold">vaultwarden</tspan></text>
</g>

<line x1="628" y1="72" x2="628" y2="344" stroke="#282727" stroke-width="2"/>
<text x="664" y="94" font-size="26" font-weight="bold" fill="#c4b28a">Strudel Homelab</text>
<text x="664" y="122" font-size="16" fill="#a6a69c">declarative from bare metal up</text>
<g font-size="17">
<text x="664" y="158"><tspan fill="#7a8382">nodes</tspan><tspan x="776" fill="#c5c9c5">6× Dell OptiPlex Micro</tspan></text>
<text x="664" y="184"><tspan fill="#7a8382">os</tspan><tspan x="776" fill="#c5c9c5">Talos Linux, secure boot</tspan></text>
<text x="664" y="210"><tspan fill="#7a8382">cni</tspan><tspan x="776" fill="#c5c9c5">Cilium, no kube-proxy</tspan></text>
<text x="664" y="236"><tspan fill="#7a8382">lb</tspan><tspan x="776" fill="#c5c9c5">Cilium BGP → MikroTik</tspan></text>
<text x="664" y="262"><tspan fill="#7a8382">vip</tspan><tspan x="776" fill="#c5c9c5">kube-vip over BGP</tspan></text>
<text x="664" y="288"><tspan fill="#7a8382">storage</tspan><tspan x="776" fill="#c5c9c5">Rook-Ceph + R730xd NAS</tspan></text>
<text x="664" y="314"><tspan fill="#7a8382">gitops</tspan><tspan x="776" fill="#c5c9c5">Flux, SOPS + Age</tspan></text>
<text x="664" y="340"><tspan fill="#7a8382">network</tspan><tspan x="776" fill="#c5c9c5">Terraform → RouterOS</tspan></text>
</g>
</g>
</svg>
