<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="MonoLisa, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" role="img" aria-label="A terminal saying Ahoi! I'm Aaron (Lil-Strudel), a DevOps engineer in Utah">
<style>
.in{animation:in .5s ease-out both}
.type{animation:type both;-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0)}
.arm{transform-box:fill-box;transform-origin:0% 100%;animation:wave 2.6s ease-in-out 1.4s infinite}
.blink{animation:blink 1.1s steps(1) 3.6s infinite}
@keyframes in{from{opacity:0}}
@keyframes type{from{-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0)}}
@keyframes wave{0%,50%,100%{transform:rotate(0)}10%,30%{transform:rotate(24deg)}20%,40%{transform:rotate(-10deg)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="1200" height="420" rx="16"/></clipPath>
<radialGradient id="wall" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#2a2421"/><stop offset=".55" stop-color="#1d1c19"/><stop offset="1" stop-color="#0d0c0c"/></radialGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="420" fill="url(#wall)"/>
<circle cx="32" cy="30" r="6" fill="#c4746e"/>
<circle cx="52" cy="30" r="6" fill="#c4b28a"/>
<circle cx="72" cy="30" r="6" fill="#87a987"/>
<text x="600" y="35" font-size="13" text-anchor="middle" fill="#7a8382">strudel@utah: ~</text>

<text x="48" y="96" font-size="18" xml:space="preserve"><tspan fill="#8ea4a2" font-weight="bold">~</tspan><tspan fill="#87a987"> ❯ </tspan></text>
<text class="type" style="animation-duration:.64s;animation-delay:.3s;animation-timing-function:steps(8)" x="48" y="96" font-size="18" xml:space="preserve"><tspan fill-opacity="0" font-weight="bold">~</tspan><tspan fill-opacity="0"> ❯ </tspan><tspan fill="#c5c9c5">ahoi</tspan></text>

<g class="in" style="animation-delay:1.05s">
<text x="44" y="176" font-size="72" font-weight="bold" fill="#c4b28a">Ahoi!</text>
<g transform="translate(298 174)" fill="none" stroke="#c5c9c5" stroke-width="5" stroke-linecap="round">
<path d="M12 -52Q-4 -24 12 4"/>
<path d="M72 -52Q88 -24 72 4"/>
<circle cx="30" cy="-30" r="4.5" fill="#c5c9c5" stroke="none"/>
<circle cx="54" cy="-30" r="4.5" fill="#c5c9c5" stroke="none"/>
<path d="M32 -15Q42 -5 52 -15"/>
<path class="arm" d="M94 -8L114 -50"/>
</g>
</g>
<text class="in" style="animation-delay:1.3s" x="48" y="220" font-size="24" fill="#c5c9c5">I'm Aaron <tspan fill="#a292a3">(Lil-Strudel)</tspan></text>
<text class="in" style="animation-delay:1.5s" x="48" y="254" font-size="18" fill="#a6a69c">Full-stack dev and DevOps engineer. I build the app, then the cluster it runs on.</text>

<text class="in" style="animation-delay:1.9s" x="48" y="304" font-size="18" xml:space="preserve"><tspan fill="#8ea4a2" font-weight="bold">~</tspan><tspan fill="#87a987"> ❯ </tspan></text>
<text class="type" style="animation-duration:1.04s;animation-delay:1.9s;animation-timing-function:steps(13)" x="48" y="304" font-size="18" xml:space="preserve"><tspan fill-opacity="0" font-weight="bold">~</tspan><tspan fill-opacity="0"> ❯ </tspan><tspan fill="#c5c9c5">cat motto</tspan></text>
<text class="in" style="animation-delay:3.1s" x="48" y="336" font-size="18" xml:space="preserve"><tspan fill="#c4b28a" font-style="italic">"Why rent a cloud when you can build one at home?"</tspan></text>

<g class="in" style="animation-delay:3.4s">
<text x="48" y="370" font-size="18" xml:space="preserve"><tspan fill="#8ea4a2" font-weight="bold">~</tspan><tspan fill="#87a987"> ❯ </tspan></text>
<rect class="blink" x="92" y="355" width="10" height="20" fill="#c5c9c5"/>
</g>

<rect y="390" width="1200" height="30" fill="#0d0c0c" fill-opacity=".85"/>
<rect y="390" width="80" height="30" fill="#8ba4b0"/>
<text x="40" y="410" font-size="15" font-weight="bold" text-anchor="middle" fill="#181616">ahoi</text>
<text x="98" y="410" font-size="15" xml:space="preserve"><tspan fill="#c4b28a" font-weight="bold">1 web</tspan><tspan fill="#625e5a">   2 api   3 cluster   4 metal</tspan></text>
<text x="1176" y="410" font-size="15" text-anchor="end" fill="#7a8382">lilstrudel.io</text>
</g>
</svg>
