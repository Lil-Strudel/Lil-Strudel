<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="MonoLisa, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" role="img" aria-label="Above deck, full-stack: TypeScript, SolidJS, React, Next.js, Svelte, Astro, Tailwind, Go, Node, Postgres, Redis and more. Below deck, DevOps: Talos Linux on bare metal, Kubernetes, Cilium, Flux, Rook-Ceph, MikroTik and Terraform, AWS, Pulumi and Docker.">
<style>
.sea{animation:drift 5s linear infinite}
.boat{transform-box:fill-box;transform-origin:50% 100%;animation:bob 4s ease-in-out infinite}
.led{animation:blink 1.6s steps(1) infinite}
.bubble{opacity:0;animation:rise 3.6s ease-in infinite}
@keyframes drift{to{transform:translateX(80px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(4px) rotate(2deg)}}
@keyframes blink{50%{opacity:.15}}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:.8}100%{opacity:0;transform:translateY(-56px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="card"><rect width="1200" height="480" rx="16"/></clipPath>
<radialGradient id="wall" cx="50%" cy="10%" r="90%"><stop offset="0" stop-color="#2a2421"/><stop offset=".6" stop-color="#1d1c19"/><stop offset="1" stop-color="#0d0c0c"/></radialGradient>
<linearGradient id="deep" x1="0" y1="236" x2="0" y2="480" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1f2b33"/><stop offset="1" stop-color="#0d0f10"/></linearGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="480" fill="url(#wall)"/>

<text x="48" y="62" font-size="24" font-weight="bold" fill="#c4b28a">above deck</text>
<text x="226" y="62" font-size="16" fill="#a6a69c">full-stack · the parts you click on</text>
<g font-size="17">
<text y="106"><tspan x="48" fill="#7a8382">frontend</tspan><tspan x="160" fill="#c5c9c5">TypeScript, SolidJS, React, Next.js, Svelte, Astro, Tailwind</tspan></text>
<text y="134"><tspan x="48" fill="#7a8382">backend</tspan><tspan x="160" fill="#c5c9c5">Go, Node, Express, TanStack Start, Drizzle, Prisma</tspan></text>
<text y="162"><tspan x="48" fill="#7a8382">data</tspan><tspan x="160" fill="#c5c9c5">Postgres, MongoDB, Redis, Electric, offline-first sync</tspan></text>
<text y="190"><tspan x="48" fill="#7a8382">apps</tspan><tspan x="160" fill="#c5c9c5">web, desktop with Wails and Electron, Discord bots, ZMK keyboards</tspan></text>
</g>

<g class="boat">
<path d="M1020 222L1020 118" stroke="#c5c9c5" stroke-width="3" stroke-linecap="round"/>
<path d="M1020 118L1040 125L1020 132Z" fill="#c4746e"/>
<path d="M1026 136L1026 210L1082 210Z" fill="#c5c9c5"/>
<path d="M1014 144L1014 210L972 210Z" fill="#c5c9c5" fill-opacity=".7"/>
<path d="M948 216L1092 216L1074 246L966 246Z" fill="#b6927b"/>
<g transform="translate(1006 233) scale(.3)" fill="none" stroke="#181616" stroke-width="6" stroke-linecap="round">
<path d="M12 -52Q-4 -24 12 4"/><path d="M72 -52Q88 -24 72 4"/>
<circle cx="30" cy="-30" r="5" fill="#181616" stroke="none"/><circle cx="54" cy="-30" r="5" fill="#181616" stroke="none"/>
<path d="M32 -15Q42 -5 52 -15"/>
</g>
</g>

<g class="sea">
<path d="M-160 236q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0L1280 480L-160 480Z" fill="url(#deep)"/>
<path d="M-160 236q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0q20 -7 40 0t40 0" fill="none" stroke="#8ba4b0" stroke-opacity=".45" stroke-width="2"/>
</g>

<text x="48" y="298" font-size="24" font-weight="bold" fill="#8ba4b0">below deck</text>
<text x="226" y="298" font-size="16" fill="#a6a69c">devops · the engine room, ideally on bare metal</text>
<g font-size="17">
<text y="340"><tspan x="48" fill="#7a8382">metal</tspan><tspan x="160" fill="#c5c9c5">Talos Linux on OptiPlex Micros, a Dell R730xd, a PiKVM</tspan></text>
<text y="368"><tspan x="48" fill="#7a8382">cluster</tspan><tspan x="160" fill="#c5c9c5">Kubernetes, Cilium BGP, kube-vip, Rook-Ceph, Flux, SOPS</tspan></text>
<text y="396"><tspan x="48" fill="#7a8382">network</tspan><tspan x="160" fill="#c5c9c5">MikroTik RouterOS and VLANs, all of it in Terraform</tspan></text>
<text y="424"><tspan x="48" fill="#7a8382">cloud</tspan><tspan x="160" fill="#c5c9c5">AWS, Terraform, Pulumi, Docker, ECS, GitHub Actions</tspan></text>
<text y="452"><tspan x="48" fill="#7a8382">desk</tspan><tspan x="160" fill="#c5c9c5">Arch, Hyprland, Neovim, tmux, hand-rolled dotfiles</tspan></text>
</g>

<circle class="bubble" style="animation-delay:0s" cx="990" cy="300" r="3" fill="none" stroke="#8ba4b0" stroke-width="1.5"/>
<circle class="bubble" style="animation-delay:1.3s" cx="1030" cy="300" r="4" fill="none" stroke="#8ba4b0" stroke-width="1.5"/>
