<rect x="954" y="308" width="132" height="132" rx="6" fill="#181616" stroke="#393836" stroke-width="2"/>
<rect x="964" y="318" width="112" height="22" rx="3" fill="#282727"/><rect x="974" y="327" width="44" height="4" rx="2" fill="#393836"/><circle class="led" style="animation-delay:0.00s" cx="1050" cy="329" r="3.5" fill="#87a987"/><circle class="led" style="animation-delay:0.90s" cx="1062" cy="329" r="3.5" fill="#c4b28a"/><rect x="964" y="348" width="112" height="22" rx="3" fill="#282727"/><rect x="974" y="357" width="44" height="4" rx="2" fill="#393836"/><circle class="led" style="animation-delay:0.37s" cx="1050" cy="359" r="3.5" fill="#87a987"/><circle class="led" style="animation-delay:1.43s" cx="1062" cy="359" r="3.5" fill="#c4b28a"/><rect x="964" y="378" width="112" height="22" rx="3" fill="#282727"/><rect x="974" y="387" width="44" height="4" rx="2" fill="#393836"/><circle class="led" style="animation-delay:0.74s" cx="1050" cy="389" r="3.5" fill="#87a987"/><circle class="led" style="animation-delay:1.96s" cx="1062" cy="389" r="3.5" fill="#c4b28a"/><rect x="964" y="408" width="112" height="22" rx="3" fill="#282727"/><rect x="974" y="417" width="44" height="4" rx="2" fill="#393836"/><circle class="led" style="animation-delay:1.11s" cx="1050" cy="419" r="3.5" fill="#87a987"/><circle class="led" style="animation-delay:2.49s" cx="1062" cy="419" r="3.5" fill="#c4b28a"/>
<text x="1020" y="462" font-size="13" text-anchor="middle" fill="#625e5a">engine room</text>
</g>
</svg>
